name: Scraping Quotidien Al-Wasil

on:
  schedule:
    # 3 tentatives par jour : 8h, 14h, 20h Paris (UTC+1 = UTC-1)
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  # Bouton manuel dans l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer même si déjà tourné aujourd"hui'
        type: boolean
        default: false

jobs:
  scrape:
    name: Scraping & Email Digest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/scraper/package-lock.json

      - name: Install dependencies
        working-directory: scripts/scraper
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: scripts/scraper
        run: npx playwright install chromium --with-deps

      # Tentative 1 — retry automatique jusqu'à 3 fois si une source plante
      # Toutes les clés sont dans un seul secret JSON : SCRAPING_ALWASIL_ALL
      - name: Run scraper (attempt 1)
        id: scrape1
        working-directory: scripts/scraper
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).GEMINI_API_KEY }}
          APPS_SCRIPT_WEBHOOK_URL: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).APPS_SCRIPT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).RESEND_API_KEY }}
          MODERATE_SECRET: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).MODERATE_SECRET }}
          ADMIN_EMAIL: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).ADMIN_EMAIL }}
          SITE_URL: https://al-wasil.fr
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: npm run scrape

      - name: Wait before retry
        if: steps.scrape1.outcome == 'failure'
        run: sleep 60

      - name: Run scraper (attempt 2)
        id: scrape2
        if: steps.scrape1.outcome == 'failure'
        working-directory: scripts/scraper
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).GEMINI_API_KEY }}
          APPS_SCRIPT_WEBHOOK_URL: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).APPS_SCRIPT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).RESEND_API_KEY }}
          MODERATE_SECRET: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).MODERATE_SECRET }}
          ADMIN_EMAIL: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).ADMIN_EMAIL }}
          SITE_URL: https://al-wasil.fr
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: npm run scrape

      - name: Wait before retry
        if: steps.scrape2.outcome == 'failure'
        run: sleep 120

      - name: Run scraper (attempt 3 — final)
        if: steps.scrape2.outcome == 'failure'
        working-directory: scripts/scraper
        env:
          GEMINI_API_KEY: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).GEMINI_API_KEY }}
          APPS_SCRIPT_WEBHOOK_URL: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).APPS_SCRIPT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).RESEND_API_KEY }}
          MODERATE_SECRET: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).MODERATE_SECRET }}
          ADMIN_EMAIL: ${{ fromJSON(secrets.SCRAPING_ALWASIL_ALL).ADMIN_EMAIL }}
          SITE_URL: https://al-wasil.fr
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: npm run scrape
