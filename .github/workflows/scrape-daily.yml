name: Veille contrôlée Al-Wasil

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    name: Pipeline des sources autorisées
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: alwasil-daily-scrape
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/scraper/package-lock.json
      - name: Installer
        working-directory: scripts/scraper
        run: npm ci
      - name: Vérifier la configuration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: test -n "$CRON_SECRET" || { echo "::error::CRON_SECRET manquant"; exit 1; }
      - name: Exécuter une fois le pipeline contrôlé
        working-directory: scripts/scraper
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npm run scrape
